resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP: ACME + redirect for known domains
server {
    listen 80;
    server_name royalsmk.com.ua www.royalsmk.com.ua;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP catch-all (IP / unknown hosts)
server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
        default_type text/plain;
    }

    location / {
        return 301 https://royalsmk.com.ua$request_uri;
    }
}

# HTTPS catch-all (IP / unknown SNI)
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/royalsmk.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/royalsmk.com.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://royalsmk.com.ua$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name royalsmk.com.ua www.royalsmk.com.ua;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/royalsmk.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/royalsmk.com.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
