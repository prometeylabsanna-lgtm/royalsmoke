{% load i18n static %}
{% with images=product.images.all %}
<div class="rs-pd__gallery" data-pd-gallery>
  <div class="rs-pd__stage">
    <button type="button" class="rs-pd__nav rs-pd__nav--prev" data-pd-prev aria-label="{% trans "Попереднє фото" %}">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M12.5 4.5L7 10l5.5 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    {% if images %}
      {% for img in images %}
        <figure class="rs-pd__slide{% if forloop.first %} is-active{% endif %}"
                data-pd-slide
                {% if forloop.first %}aria-hidden="false"{% else %}aria-hidden="true"{% endif %}>
          <img src="{{ img.image.url }}"
               alt="{{ product.name }}"
               width="900"
               height="1200"
               {% if forloop.first %}fetchpriority="high"{% else %}loading="lazy"{% endif %}>
        </figure>
      {% endfor %}
    {% else %}
      <figure class="rs-pd__slide is-active rs-pd__slide--empty" data-pd-slide aria-hidden="false">
        <span class="rs-pd__placeholder">{% trans "Немає фото" %}</span>
      </figure>
    {% endif %}

    <figure class="rs-pd__slide rs-pd__slide--video" data-pd-slide aria-hidden="true">
      <video class="rs-pd__video-el"
             data-pd-card-video
             muted
             defaultMuted
             loop
             playsinline
             webkit-playsinline
             preload="auto"
             disablepictureinpicture>
        <source src="{% static 'video/product-card.mp4' %}?v=1" type="video/mp4">
      </video>
    </figure>

    <button type="button" class="rs-pd__nav rs-pd__nav--next" data-pd-next aria-label="{% trans "Наступне фото" %}">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M7.5 4.5L13 10l-5.5 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="rs-pd__thumbs" data-pd-thumbs role="tablist" aria-label="{% trans "Мініатюри" %}">
    {% if images %}
      {% for img in images %}
        <button type="button"
                class="rs-pd__thumb{% if forloop.first %} is-active{% endif %}"
                data-pd-thumb
                data-index="{{ forloop.counter0 }}"
                role="tab"
                aria-selected="{% if forloop.first %}true{% else %}false{% endif %}"
                aria-label="{% blocktrans with n=forloop.counter %}Фото {{ n }}{% endblocktrans %}">
          <img src="{{ img.image.url }}" alt="" loading="lazy" width="96" height="96">
        </button>
      {% endfor %}
    {% else %}
      <button type="button"
              class="rs-pd__thumb is-active rs-pd__thumb--empty"
              data-pd-thumb
              data-index="0"
              role="tab"
              aria-selected="true"
              aria-label="{% trans "Фото 1" %}"
              disabled></button>
    {% endif %}

    <button type="button"
            class="rs-pd__thumb rs-pd__thumb--video"
            data-pd-thumb
            data-index="{% if images %}{{ images|length }}{% else %}1{% endif %}"
            role="tab"
            aria-selected="false"
            aria-label="{% trans "Відео" %}">
      <video class="rs-pd__thumb-video"
             muted
             playsinline
             webkit-playsinline
             preload="metadata"
             aria-hidden="true">
        <source src="{% static 'video/product-card.mp4' %}?v=1" type="video/mp4">
      </video>
      <span class="rs-pd__thumb-label">Video</span>
    </button>
  </div>
</div>
{% endwith %}
