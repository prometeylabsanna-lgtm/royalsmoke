{% load i18n %}
<form class="rs-compare-toggle"
      method="post"
      action="{% url 'catalog:compare_toggle' %}"
      hx-post="{% url 'catalog:compare_toggle' %}"
      hx-target="this"
      hx-swap="outerHTML">
  {% csrf_token %}
  <input type="hidden" name="product_id" value="{{ product.id }}">
  <button type="submit"
          class="rs-compare-btn{% if product.id in compare_ids %} is-active{% endif %}"
          aria-label="{% if product.id in compare_ids %}{% trans 'Прибрати з порівняння' %}{% else %}{% trans 'Порівняти' %}{% endif %}"
          aria-pressed="{% if product.id in compare_ids %}true{% else %}false{% endif %}">
    <svg class="rs-compare-btn__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 6h6M14 6h6M4 12h16M4 18h6M14 18h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M10 4v4M14 16v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span class="rs-compare-btn__label">{% if product.id in compare_ids %}{% trans "У порівнянні" %}{% else %}{% trans "Порівняти" %}{% endif %}</span>
  </button>
</form>
