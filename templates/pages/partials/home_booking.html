{% load static %}
<section class="rs-section rs-home-booking" id="home-booking" aria-label="Бронювання">
  <div class="rs-container">
    <div class="rs-home-booking__panel">
      <header class="rs-home-booking__head">
        <div class="rs-home-booking__intro">
          <p class="rs-home-booking__kicker">Сервіс</p>
          <h2 class="rs-home-booking__title">Бронювання</h2>
        </div>
        <div class="rs-home-booking__media">
          <img
            src="{% static 'img/booking/lounge.jpg' %}"
            alt="Панорама лаунжу Royal Smoke"
            width="1600"
            height="900"
            loading="lazy"
            decoding="async"
          >
        </div>
      </header>

      <form
        class="rs-home-booking__form"
        method="post"
        action="{% url 'booking:request' %}"
        novalidate
      >
        {% csrf_token %}
        <input type="hidden" name="next" value="/#home-booking">

        <div class="rs-home-booking__fields">
          <div class="rs-home-booking__field">
            <label class="sr-only" for="home_booking_name">Імʼя</label>
            <input
              id="home_booking_name"
              type="text"
              name="name"
              required
              autocomplete="name"
              maxlength="120"
              placeholder="Імʼя"
            >
          </div>
          <div class="rs-home-booking__field">
            <label class="sr-only" for="home_booking_phone">Телефон</label>
            <input
              id="home_booking_phone"
              type="tel"
              name="phone"
              required
              autocomplete="tel"
              maxlength="30"
              placeholder="Телефон"
            >
          </div>
          <div class="rs-home-booking__field rs-home-booking__field--wish">
            <label class="sr-only" for="home_booking_comment">Побажання</label>
            <input
              id="home_booking_comment"
              type="text"
              name="comment"
              maxlength="500"
              placeholder="Побажання (необовʼязково)"
            >
          </div>
          <button type="submit" class="rs-home-booking__submit">Забронювати</button>
        </div>
      </form>
    </div>
  </div>
</section>
