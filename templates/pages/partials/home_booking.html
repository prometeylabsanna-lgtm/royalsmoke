{% load static i18n %}
<article class="rs-svc-card" id="home-booking" aria-label="{% trans 'Бронювання' %}" data-rs-reveal>
  <div class="rs-svc-card__media">
    <img
      src="{% static 'img/booking/lounge.jpg' %}"
      alt="{% trans 'Лаунж Royal Smoke' %}"
      width="800"
      height="1000"
      loading="lazy"
      decoding="async"
    >
    <span class="rs-svc-card__veil" aria-hidden="true"></span>
  </div>

  <div class="rs-svc-card__body">
    <h2 class="rs-svc-card__title">{% trans "Бронювання" %}</h2>
    <p class="rs-svc-card__lead">{% trans "Дегустація, консультація або візит у шоурум." %}</p>
    <a class="rs-btn rs-btn--gold rs-svc-card__submit" href="{% url 'booking:page' %}">{% trans "Обрати час" %}</a>
  </div>
</article>
