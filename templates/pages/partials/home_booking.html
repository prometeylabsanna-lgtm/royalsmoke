{% load static %}
<article class="rs-svc-card" id="home-booking" aria-label="Бронювання">
  <div class="rs-svc-card__media">
    <img
      src="{% static 'img/booking/lounge.jpg' %}"
      alt="Лаунж Royal Smoke"
      width="800"
      height="1000"
      loading="lazy"
      decoding="async"
    >
    <span class="rs-svc-card__veil" aria-hidden="true"></span>
  </div>

  <div class="rs-svc-card__body">
    <h2 class="rs-svc-card__title">Бронювання</h2>
    <p class="rs-svc-card__lead">Дегустація, консультація або візит у шоурум.</p>

    <form
      class="rs-svc-card__form"
      method="post"
      action="{% url 'booking:request' %}"
      novalidate
    >
      {% csrf_token %}
      <input type="hidden" name="next" value="/#home-booking">

      <div class="rs-svc-card__fields">
        <div class="rs-svc-card__field">
          <label class="sr-only" for="home_booking_name">Імʼя</label>
          <input
            id="home_booking_name"
            type="text"
            name="name"
            required
            autocomplete="name"
            maxlength="120"
            placeholder="Імʼя"
          >
        </div>
        <div class="rs-svc-card__field">
          <label class="sr-only" for="home_booking_phone">Телефон</label>
          <input
            id="home_booking_phone"
            type="tel"
            name="phone"
            required
            autocomplete="tel"
            maxlength="30"
            placeholder="Телефон"
          >
        </div>
        <div class="rs-svc-card__field rs-svc-card__field--full">
          <label class="sr-only" for="home_booking_comment">Побажання</label>
          <input
            id="home_booking_comment"
            type="text"
            name="comment"
            maxlength="500"
            placeholder="Побажання (необовʼязково)"
          >
        </div>
        <button type="submit" class="rs-svc-card__submit">Забронювати</button>
      </div>
    </form>
  </div>
</article>
