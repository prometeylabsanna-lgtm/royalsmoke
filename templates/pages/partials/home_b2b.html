{% load static %}
<article class="rs-svc-card" id="home-b2b" aria-label="B2B" data-rs-reveal data-reveal-delay="120">
  <div class="rs-svc-card__media">
    <img
      src="{% static 'img/service/b2b.jpg' %}"
      alt="Корпоративні набори Royal Smoke"
      width="800"
      height="1000"
      loading="lazy"
      decoding="async"
    >
    <span class="rs-svc-card__veil" aria-hidden="true"></span>
  </div>

  <div class="rs-svc-card__body">
    <h2 class="rs-svc-card__title">B2B</h2>
    <p class="rs-svc-card__lead">Прайс для барів, готелів і корпоративних подарунків.</p>

    <form
      class="rs-svc-card__form"
      method="post"
      action="{% url 'leads:b2b' %}"
      data-rs-validate
      novalidate
    >
      {% csrf_token %}
      <input type="hidden" name="next" value="/#home-b2b">

      <div class="rs-svc-card__fields rs-svc-card__fields--b2b">
        <div class="rs-svc-card__field">
          <label class="sr-only" for="home_b2b_company">Компанія</label>
          <input
            id="home_b2b_company"
            type="text"
            name="company"
            required
            data-rs-rule="required"
            maxlength="160"
            placeholder="Компанія"
          >
          <p class="rs-field__error" data-rs-error hidden></p>
        </div>
        <div class="rs-svc-card__field">
          <label class="sr-only" for="home_b2b_name">Контактна особа</label>
          <input
            id="home_b2b_name"
            type="text"
            name="name"
            required
            data-rs-rule="name"
            autocomplete="name"
            maxlength="120"
            placeholder="Контакт"
          >
          <p class="rs-field__error" data-rs-error hidden></p>
        </div>
        <div class="rs-svc-card__field">
          <label class="sr-only" for="home_b2b_phone">Телефон</label>
          <input
            id="home_b2b_phone"
            type="tel"
            name="phone"
            required
            data-rs-rule="phone"
            autocomplete="tel"
            maxlength="30"
            placeholder="Телефон"
          >
          <p class="rs-field__error" data-rs-error hidden></p>
        </div>
        <div class="rs-svc-card__field">
          <label class="sr-only" for="home_b2b_email">Email</label>
          <input
            id="home_b2b_email"
            type="email"
            name="email"
            required
            data-rs-rule="email"
            autocomplete="email"
            placeholder="Email"
          >
          <p class="rs-field__error" data-rs-error hidden></p>
        </div>
        <div class="rs-svc-card__field rs-svc-card__field--full">
          <label class="sr-only" for="home_b2b_message">Що цікавить</label>
          <input
            id="home_b2b_message"
            type="text"
            name="message"
            required
            data-rs-rule="required"
            maxlength="500"
            placeholder="Прайс, гравіювання…"
          >
          <p class="rs-field__error" data-rs-error hidden></p>
        </div>
        <button type="submit" class="rs-svc-card__submit">Запросити прайс</button>
      </div>
    </form>
  </div>
</article>
