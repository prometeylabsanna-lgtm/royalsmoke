{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'uk' }}">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d0c">
  <title>{% trans "Каталог офлайн" %} — Royal Smoke</title>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}?v=10">

<body class="rs-pwa-offline" data-rs-offline-root>
