{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<body style="font-family:Georgia,serif;color:#1a1a1a;line-height:1.5">
  <h1 style="font-size:20px">{% trans "Оплату підтверджено" %}</h1>
  <p>{% blocktrans with num=order.order_number %}Замовлення {{ num }}{% endblocktrans %}</p>
  <p>{% trans "Сума" %}: {{ order.total }} {{ order.currency }}</p>
</body>
</html>
