{% load i18n %}
{% if cities %}
<ul class="rs-np-list" role="listbox">
  {% for c in cities %}
  <li>
    <button type="button" class="rs-np-list__item"
            data-np-city-ref="{{ c.ref }}"
            data-np-city-name="{{ c.name }}">
      {{ c.name }}{% if c.area %} <small>{{ c.area }}</small>{% endif %}
    </button>
  </li>
  {% endfor %}
</ul>
{% elif q|length >= 2 %}
<p class="rs-np-empty">{% trans "Міст за запитом не знайдено" %}</p>
{% endif %}
