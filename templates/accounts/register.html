{% extends "base.html" %}

{% block title %}Реєстрація — {{ site_settings.site_name|default:"Royal Smoke" }}{% endblock %}

{% block content %}
<div class="rs-container rs-auth">
  <div class="rs-auth__card" data-rs-reveal>
    <h1 class="rs-auth__title">Реєстрація</h1>
    <p class="rs-form__hint">Створіть кабінет для швидкого оформлення.</p>
    <form class="rs-form" method="post" action="{% url 'accounts:register' %}">
      {% csrf_token %}
      <div class="rs-field">
        <label for="id_name">Імʼя</label>
        <input id="id_name" type="text" name="name" required autocomplete="name" value="{{ form.name.value|default:'' }}">
      </div>
      <div class="rs-field">
        <label for="id_email">Email</label>
        <input id="id_email" type="email" name="email" required autocomplete="email" value="{{ form.email.value|default:'' }}">
      </div>
      <div class="rs-field">
        <label for="id_phone">Телефон</label>
        <input id="id_phone" type="tel" name="phone" autocomplete="tel" value="{{ form.phone.value|default:'' }}">
      </div>
      <div class="rs-field">
        <label for="id_password1">Пароль</label>
        <input id="id_password1" type="password" name="password1" required autocomplete="new-password">
      </div>
      <div class="rs-field">
        <label for="id_password2">Повторіть пароль</label>
        <input id="id_password2" type="password" name="password2" required autocomplete="new-password">
      </div>
      <label class="rs-check">
        <input type="checkbox" name="age_confirm" required>
        <span>Мені є 21 рік</span>
      </label>
      <div class="rs-form__actions">
        <button type="submit" class="rs-btn rs-btn--gold rs-btn--block">Створити акаунт</button>
      </div>
    </form>
    <p class="rs-auth__switch">Вже є акаунт? <a href="{% url 'accounts:login' %}">Увійти</a></p>
  </div>
</div>
{% endblock %}
