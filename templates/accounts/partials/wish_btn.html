{% load i18n %}
<form class="rs-wish"
      method="post"
      action="{% url 'accounts:wishlist_toggle' %}"
      hx-post="{% url 'accounts:wishlist_toggle' %}"
      hx-target="this"
      hx-swap="outerHTML">
  {% csrf_token %}
  <input type="hidden" name="product_id" value="{{ product.id }}">
  <button type="submit"
          class="rs-wish-btn{% if product.id in wishlist_ids %} is-active{% endif %}"
          aria-label="{% if product.id in wishlist_ids %}{% trans 'Прибрати з вибраного' %}{% else %}{% trans 'Додати до вибраного' %}{% endif %}"
          aria-pressed="{% if product.id in wishlist_ids %}true{% else %}false{% endif %}">
    <svg class="rs-wish-btn__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
      <path class="rs-wish-btn__path"
            d="M12 21s-6.6-4.35-9.2-8.1C.8 9.6 2.1 5.5 6.2 5.5c2.05 0 3.45 1.2 4.4 2.55C11.55 6.7 12.95 5.5 15 5.5c4.1 0 5.4 4.1 3.2 7.4C18.6 16.65 12 21 12 21z"/>
    </svg>
  </button>
</form>
