{% extends "base.html" %}

{% block title %}B2B — {{ site_settings.site_name|default:"Royal Smoke" }}{% endblock %}

{% block content %}
<header class="rs-page-head" data-rs-reveal>
  <h1>B2B</h1>
  <p>Прайс і умови для барів, готелів і корпоративних подарунків.</p>
</header>

<div class="rs-container rs-service-page" data-rs-reveal data-reveal-delay="80">
  <form class="rs-form" method="post" action="{% url 'leads:b2b' %}">
    {% csrf_token %}
    <div class="rs-field">
      <label for="id_company">Компанія</label>
      <input id="id_company" type="text" name="company" required>
    </div>
    <div class="rs-field">
      <label for="id_name">Контактна особа</label>
      <input id="id_name" type="text" name="name" required autocomplete="name">
    </div>
    <div class="rs-field">
      <label for="id_phone">Телефон</label>
      <input id="id_phone" type="tel" name="phone" required autocomplete="tel">
    </div>
    <div class="rs-field">
      <label for="id_email">Email</label>
      <input id="id_email" type="email" name="email" required autocomplete="email">
    </div>
    <div class="rs-field">
      <label for="id_message">Що цікавить</label>
      <textarea id="id_message" name="message" rows="4" placeholder="Прайс, гравіювання, корпоративні набори…"></textarea>
    </div>
    <div class="rs-form__actions">
      <button type="submit" class="rs-btn rs-btn--gold rs-btn--block">Запросити прайс</button>
    </div>
  </form>
</div>
{% endblock %}
